[unstable]
json-target-spec = true
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = ["aarch64-kettle-kernel.json", "x86_64-kettle-kernel.json"]

[target.'cfg(target_arch = "aarch64")']
runner = [
	"bash",
	"-c",
	"source .env && qemu-system-aarch64 -M $PLATFORM,virtualization=on -cpu max,pauth-impdef=on -m 1024 -cpu cortex-a72 -serial stdio -display none -kernel target/aarch64-kettle-kernel/debug/kettle-kernel"
]

[target.'cfg(target_arch = "x86_64")']
runner = [
	"bash",
	"-c",
	"source .env && qemu-system-x86_64 -M $PLATFORM,virtualization=on -cpu max,pauth-impdef=on -m 1024 -serial stdio -display none -kernel target/x86_64-kettle-kernel/debug/kettle-kernel"
]
