[unstable]
build-std-features = ["compiler-builtins-mem"]
build-std = ["core", "compiler_builtins"]

[build]
target = ["aarch64-kettle-kernel.json"]

[target.'cfg(target_arch = "aarch64")']
runner = [
	"bash",
	"-c",
	"source .env && qemu-system-aarch64 -M $PLATFORM -d in_asm -cpu cortex-a72 -display none -kernel target/aarch64-kettle-kernel/debug/kettle-kernel"
]
